name: CI-CD CleanArchitecture.Full

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Restore, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CleanArchitecture.Full.slnx

      - name: Build
        run: dotnet build CleanArchitecture.Full.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CleanArchitecture.Full.slnx --configuration Release --no-build --verbosity normal

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint helm/accounts-api
          helm template accounts-api helm/accounts-api > /dev/null
          helm template accounts-api helm/accounts-api -f helm/accounts-api/values-dev.yaml > /dev/null
          helm template accounts-api helm/accounts-api -f helm/accounts-api/values-qa.yaml > /dev/null

  build-and-push:
    name: Build and publish Docker image
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/accounts-api:${{ steps.meta.outputs.tag }}
            ${{ vars.DOCKERHUB_USERNAME }}/accounts-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    name: Deploy to local Minikube
    needs: build-and-push
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Verify Minikube context
        shell: powershell
        run: |
          minikube status
          kubectl config use-context minikube
          kubectl cluster-info

      - name: Deploy PostgreSQL and Seq
        shell: powershell
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s
          kubectl rollout status statefulset/postgres --namespace accounts --timeout=120s
          kubectl rollout status deployment/seq --namespace accounts --timeout=120s

      - name: Apply database schema and seed
        shell: powershell
        run: |
          Get-Content database/02_create_table_and_seed.sql -Raw |
            kubectl exec --stdin postgres-0 --namespace accounts -- `
              psql -v ON_ERROR_STOP=1 -U postgres -d accountsdb

      - name: Deploy API with Helm
        shell: powershell
        run: |
          helm upgrade --install accounts-api ./helm/accounts-api `
            --namespace accounts `
            --create-namespace `
            --set image.repository=docker.io/${{ vars.DOCKERHUB_USERNAME }}/accounts-api `
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} `
            --set image.pullPolicy=Always `
            --wait `
            --timeout 3m

      - name: Verify API rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/accounts-api --namespace accounts --timeout=120s
          kubectl get pods,services --namespace accounts
