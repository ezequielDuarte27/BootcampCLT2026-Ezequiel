replicaCount: 2

nameOverride: ""
fullnameOverride: ""

image:
  repository: docker.io/19942709/accounts-api
  tag: latest
  pullPolicy: Always

containerPort: 8080

# Datos no sensibles -> ConfigMap
appName: CleanArchitecture.Full.Api
aspnetEnvironment: Development
logLevel: Information

seq:
  url: http://seq:5341

# Datos de conexión a la base -> Secret (se arma la connection string en el template)
postgres:
  host: postgres
  port: 5432
  database: accountsdb
  username: postgres
  password: postgres

# Issuer/Audience no son sensibles -> ConfigMap; la clave de firma y el admin -> Secret
jwt:
  issuer: CleanArchitecture.Full.Api
  audience: CleanArchitecture.Full.Clients
  signingKey: dev-only-signing-key-change-me-in-production-1234567890
  expirationMinutes: 60

auth:
  adminUsername: admin
  adminPassword: Admin123!

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 30080

# Init container que espera a que Postgres esté listo antes de arrancar la API
waitForPostgres:
  enabled: true
  image: postgres:16

probes:
  readiness:
    path: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 10
  liveness:
    path: /health/live
    initialDelaySeconds: 20
    periodSeconds: 15

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

